<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Card Game</title>
    <link
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <div class="title-screen">
        <h1>Click to Start</h1>
        <br />
        <button id="start-game" class="btn btn-primary">Start Game</button>
      </div>
      <div class="difficulty-screen" style="display: none">
        <h2>Select the difficulty</h2>
        <div class="difficulty-buttons">
          <button id="easy" class="btn btn-success">Easy</button>
          <button id="medium" class="btn btn-warning">Medium</button>
          <button id="hard" class="btn btn-danger">Hard</button>
        </div>
      </div>
      <div class="game-board mt-4" id="game-board"></div>
      <div class="control-panel" style="display: none">
        <br />
        <button id="reset" class="btn btn-secondary ml-2">Reset</button>
        <button id="go-back" class="btn btn-secondary ml-2">Go back</button>
        <div class="timer" id="timer">Time left: 0s</div>
      </div>
      <div class="message-screen" id="message-screen">
        <h1 id="message"></h1>
        <button id="message-button" class="btn btn-primary"></button>
      </div>
    </div>
    <script src="logic.js"></script>
  </body>
</html>
